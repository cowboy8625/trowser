[package]
name = "troswer"
version = "0.1.0"
authors = ["<cowboy8625>", "<adam>"]
license = "MIT"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"
crossterm = "0.29.0"
ratatui = { version = "0.30.0", features = ["all-widgets"] }
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }


[[bin]]
name = "trowser"
path = "src/main.rs"

[lib]
name = "trowser"
path = "src/lib.rs"
